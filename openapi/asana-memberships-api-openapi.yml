    put:
      summary: Asana Update a membership
      description: 'An existing membership can be updated by making a `PUT` request on the membership. Only the fields provided in the `data` block will be updated;

        any unspecified fields will remain unchanged. Memberships on `goals`, `projects` and `portfolios` can be updated.


        Returns the full record of the updated membership.'
      tags:
      - Memberships
      operationId: updateMembership
      requestBody:
        description: The membership to update.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/MembershipRequest'
      responses:
        200:
          description: Successfully updated the requested membership.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MembershipResponse'
        400:
